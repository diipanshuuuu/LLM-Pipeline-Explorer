<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cortext-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#60A5FA"/>
      <stop offset="75%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle grid dots in background -->
  <circle cx="16" cy="16" r="0.8" fill="#334155" opacity="0.6"/>
  <circle cx="32" cy="16" r="0.8" fill="#334155" opacity="0.6"/>
  <circle cx="48" cy="16" r="0.8" fill="#334155" opacity="0.6"/>
  <circle cx="16" cy="32" r="0.8" fill="#334155" opacity="0.6"/>
  <circle cx="48" cy="32" r="0.8" fill="#334155" opacity="0.6"/>
  <circle cx="16" cy="48" r="0.8" fill="#334155" opacity="0.6"/>
  <circle cx="32" cy="48" r="0.8" fill="#334155" opacity="0.6"/>
  <circle cx="48" cy="48" r="0.8" fill="#334155" opacity="0.6"/>

  <!-- Attention Arcs behind nodes -->
  <path d="M46 20 C32 10, 16 18, 18 32 C19 42, 30 50, 46 44" 
        fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2.5 2" opacity="0.35"/>
  <path d="M22 25 Q38 32 46 20" 
        fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2 1.5" opacity="0.45"/>

  <!-- Glowing letter 'C' ribbon formed by vector path -->
  <path d="M46 19 C38 12, 17 14, 15 28 C13 41, 23 52, 41 50 C46 49, 47 46, 47 46" 
        fill="none" stroke="url(#cortext-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Neural Token Nodes -->
  <circle cx="46" cy="19" r="4" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="46" cy="19" r="1.8" fill="#FFFFFF"/>

  <circle cx="21" cy="21" r="3.5" fill="#60A5FA"/>
  <circle cx="15" cy="33" r="3.8" fill="#818CF8" filter="url(#glow)"/>
  <circle cx="15" cy="33" r="1.6" fill="#FFFFFF"/>

  <circle cx="26" cy="48" r="3.2" fill="#F59E0B"/>
  
  <circle cx="44" cy="47" r="4.2" fill="#F59E0B" filter="url(#glow)"/>
  <circle cx="44" cy="47" r="2" fill="#FFFFFF"/>
</svg>
